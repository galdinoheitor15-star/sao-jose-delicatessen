<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Gerência · São José</title>
  <meta name="theme-color" content="#fffdf9">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/panel.css?v=4">
</head>
<body>
  <div id="root"></div>

  <dialog class="modal" id="edModal" style="width:min(620px,calc(100% - 24px))">
    <form method="dialog" class="modal__in" id="edForm">
      <h3 id="edTitle">Produto</h3>
      <div class="img-drop">
        <span id="edImgPrev"></span>
        <div style="display:grid;gap:6px;flex:1">
          <label class="btn btn--line btn--sm" style="cursor:pointer">Enviar foto<input type="file" id="edFile" accept="image/*" hidden></label>
          <button type="button" class="btn btn--ghost btn--sm" id="edImgRm">Remover foto</button>
        </div>
      </div>
      <label class="field"><span>Nome</span><input id="edName" required maxlength="80"></label>
      <div class="grid2">
        <label class="field"><span>Categoria</span><select id="edCat"></select></label>
        <label class="field"><span>Subgrupo (opcional)</span><input id="edGroup" maxlength="40" placeholder="Ex.: Pizzas, Cafés"></label>
      </div>
      <label class="field"><span>Descrição</span><textarea id="edDesc" rows="2" maxlength="220"></textarea></label>
      <div class="grid2">
        <label class="field"><span>Preço (R$)</span><input id="edPrice" inputmode="decimal" placeholder="Vazio = sob consulta"></label>
        <label class="field"><span>Unidade (opcional)</span><input id="edUnit" maxlength="20" placeholder="fatia, por kg, 500ml…"></label>
      </div>
      <div class="field"><span>Tamanhos com preço próprio (opcional)</span>
        <div class="sizes-ed" id="edSizes"></div>
        <button type="button" class="btn btn--line btn--sm" id="edAddSize" style="justify-self:start">+ Tamanho</button>
      </div>
      <div class="grid2">
        <label class="field"><span>Opções (separadas por vírgula)</span><input id="edOpts" placeholder="Frango, Charque"></label>
        <label class="field"><span>Cliente escolhe até</span><select id="edMulti"><option value="0">1 opção</option><option value="2">2 opções</option><option value="3">3 opções</option><option value="4">4 opções</option></select></label>
      </div>
      <div style="display:flex;gap:18px;flex-wrap:wrap">
        <label class="check"><input type="checkbox" id="edActive"> Disponível hoje</label>
        <label class="check"><input type="checkbox" id="edFeat"> Destaque no site</label>
      </div>
      <div class="modal__foot"><button class="btn btn--line" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">Salvar produto</button></div>
    </form>
  </dialog>

  <script type="module" src="../js/admin.js?v=2"></script>
</body>
</html>
